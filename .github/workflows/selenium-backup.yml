name: Selenium Backup

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Verificar Chrome
        run: |
          which google-chrome || true
          which chrome || true
          which chromium || true
          google-chrome --version || true
          chrome --version || true
          chromium --version || true

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar backup com Selenium
        run: |
          python selenium_backup.py \
            --base-url "https://anitube.vip" \
            --urls-file "urls.txt" \
            --max-pages 50 \
            --max-depth 2 \
            --delay-min 3 \
            --delay-max 8 \
            --wait 5

      - name: Salvar alterações
        run: |
          git config --global user.name "backup-bot"
          git config --global user.email "backup-bot@users.noreply.github.com"
          git add backup/ logs/ urls.txt
          git commit -m "Atualizar backup Selenium" || echo "Nada novo para salvar"
          git push
